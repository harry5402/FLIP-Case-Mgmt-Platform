<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bulk Defendant Upload</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="pill" id="back-to-case" href="index.html">Back to Case</a>
      <a class="home-title" href="index.html">FLIP Schedule A Litigation</a>
      <div class="header-spacer"></div>
    </header>

    <main class="layout single">
      <section class="panel">
        <div class="panel-header">
          <h2>Bulk Defendant Upload</h2>
          <div id="case-meta" class="muted">Loading...</div>
        </div>

        <div class="notes-card">
          <div class="info-card-header">
            <h3>Upload CSV</h3>
          </div>
          <form id="upload-form" class="form-grid">
            <label class="form-field">
              <span>CSV File</span>
              <input type="file" name="file" accept=".csv" required />
            </label>
          </form>
          <div id="mapping-panel" class="table-card hidden">
            <div class="info-card-header">
              <h3>Column Mapping</h3>
            </div>
            <div class="form-grid">
              <label class="form-field">
                <span>Seller (required)</span>
                <select id="map-seller"></select>
              </label>
              <label class="form-field">
                <span>Platform (required)</span>
                <select id="map-platform"></select>
              </label>
              <label class="form-field">
                <span>Business Name</span>
                <select id="map-business-name"></select>
              </label>
              <label class="form-field">
                <span>Located In</span>
                <select id="map-located-in"></select>
              </label>
              <label class="form-field">
                <span>Seller Location</span>
                <select id="map-seller-location"></select>
              </label>
              <label class="form-field">
                <span>Seller URL</span>
                <select id="map-seller-url"></select>
              </label>
            </div>
          </div>
          <div class="form-actions">
            <div class="form-error" id="upload-error"></div>
            <button class="ghost-button" type="submit" form="upload-form">
              Import Defendants
            </button>
          </div>
          <div id="upload-result" class="toast hidden"></div>
        </div>
      </section>
    </main>

    <script src="auth.js"></script>
    <script>
      requireAuth();
    </script>
    <script src="data.js"></script>
    <script src="bulk-upload.js"></script>
  </body>
</html>
