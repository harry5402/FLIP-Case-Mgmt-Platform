<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bulk Defendant Upload</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="pill" id="back-to-case" href="index.html">Back to Case</a>
      <a class="home-title" href="index.html">FLIP Schedule A Litigation</a>
      <div class="header-spacer"></div>
    </header>

    <main class="layout single">
      <section class="panel">
        <div class="panel-header">
          <h2>Bulk Defendant Upload</h2>
          <div id="case-meta" class="muted">Loading...</div>
        </div>

        <div class="notes-card">
          <div class="info-card-header">
            <h3>Upload CSV</h3>
          </div>
          <form id="upload-form" class="form-grid">
            <label class="form-field">
              <span>CSV File</span>
              <input type="file" name="file" accept=".csv" required />
            </label>
          </form>
          <div class="form-actions">
            <div class="form-error" id="upload-error"></div>
            <button class="ghost-button" type="submit" form="upload-form">
              Import Defendants
            </button>
          </div>
          <div id="upload-result" class="toast hidden"></div>
        </div>
      </section>
    </main>

    <script src="auth.js"></script>
    <script>
      requireAuth();
    </script>
    <script src="data.js"></script>
    <script src="bulk-upload.js"></script>
  </body>
</html>
