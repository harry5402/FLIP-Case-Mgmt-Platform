<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly Tasklist</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="pill" href="index.html">Back to Dashboard</a>
      <a class="home-title" href="index.html">FLIP Schedule A Litigation</a>
      <div class="header-spacer"></div>
    </header>

    <main class="layout single">
      <section class="panel">
        <div class="panel-header">
          <div class="panel-header-row">
            <div>
              <h2>Weekly Tasklist</h2>
              <div id="weekly-tasklist-subtitle" class="muted">Current work week</div>
            </div>
            <div class="panel-header-actions">
              <button id="new-general-task-btn" class="ghost-button" type="button">+ New Task</button>
            </div>
          </div>
        </div>

        <div id="new-general-task-modal" class="modal hidden">
          <div class="modal-card">
            <div class="info-card-header">
              <h3>New General Task</h3>
              <button class="ghost-button modal-close" type="button">Close</button>
            </div>
            <form id="new-general-task-form" class="form-grid">
              <label class="form-field">
                <span>Task Name</span>
                <input id="general-task-name" name="taskType" type="text" required placeholder="What needs to be done?" />
              </label>
              <label class="form-field">
                <span>Assign To</span>
                <select id="general-task-assignee" name="assignedToUserId">
                  <option value="">Unassigned</option>
                </select>
              </label>
              <label class="form-field">
                <span>Due Date</span>
                <input id="general-task-due" name="dueDate" type="date" required />
              </label>
            </form>
            <div class="form-actions">
              <div id="general-task-error" class="form-error"></div>
              <button id="save-general-task" class="ghost-button" type="submit" form="new-general-task-form">Create Task</button>
            </div>
          </div>
        </div>
        <div id="weekly-task-groups" class="group-stack"></div>
      </section>
    </main>

    <script src="auth.js"></script>
    <script>
      requireAuth();
    </script>
    <script src="data.js"></script>
    <script src="weekly-tasklist.js"></script>
  </body>
</html>
