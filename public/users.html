<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="pill" href="index.html">Back to Dashboard</a>
      <a class="home-title" href="index.html">FLIP Schedule A Litigation</a>
      <button id="logout-button" class="ghost-button" type="button">Logout</button>
    </header>

    <main class="layout single">
      <section class="panel">
        <div class="panel-header">
          <h2>Users</h2>
          <div class="muted">Admin only</div>
        </div>

        <form id="user-form" class="form-grid">
          <label class="form-field">
            <span>Name</span>
            <input name="name" />
          </label>
          <label class="form-field">
            <span>Email</span>
            <input name="email" type="email" required />
          </label>
          <label class="form-field">
            <span>Password</span>
            <input name="password" type="password" required />
          </label>
        </form>

        <div class="form-actions">
          <div id="users-error" class="form-error"></div>
          <button class="ghost-button" type="submit" form="user-form">Add User</button>
        </div>

        <div class="table-card">
          <div class="info-card-header">
            <h3>Existing Users</h3>
          </div>
          <div class="table-wrap">
            <table id="users-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="auth.js"></script>
    <script>
      requireAdmin();
    </script>
    <script src="users.js"></script>
  </body>
</html>
