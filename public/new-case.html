<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Case</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="pill" href="index.html">Back to Dashboard</a>
      <a class="home-title" href="index.html">FLIP Schedule A Litigation</a>
      <div class="header-spacer"></div>
    </header>

    <main class="layout single">
      <section class="panel">
        <div class="panel-header">
          <h2>Create New Case</h2>
          <div class="muted">Fields mirror the Case Info section</div>
        </div>

        <form id="new-case-form" class="form-grid">
          <label class="form-field">
            <span>Case Name (required)</span>
            <input name="caseName" required />
          </label>
          <label class="form-field">
            <span>Client Name (required)</span>
            <input name="clientName" required />
          </label>
          <label class="form-field">
            <span>Plaintiff Name</span>
            <input name="plaintiff" />
          </label>
          <label class="form-field">
            <span>Brand Name</span>
            <input name="brandName" />
          </label>
          <label class="form-field">
            <span>IP Claims</span>
            <input name="ipClaimsSummary" />
          </label>
          <label class="form-field">
            <span>Plaintiff Profit per Unit</span>
            <input name="plaintiffProfitPerUnit" type="number" />
          </label>
          <label class="form-field">
            <span>Jurisdiction</span>
            <input name="jurisdiction" />
          </label>
          <label class="form-field">
            <span>Case #</span>
            <input name="caseNumber" />
          </label>
          <label class="form-field">
            <span>Judge</span>
            <input name="judge" />
          </label>
          <label class="form-field">
            <span>Status</span>
            <select name="status">
              <option value="Undelivered">Undelivered</option>
              <option value="Active">Active</option>
              <option value="Fully Finished">Fully Finished</option>
            </select>
          </label>
          <label class="form-field">
            <span>Updated By</span>
            <input name="updatedBy" />
          </label>
        </form>

        <div class="form-actions">
          <div class="form-error" id="form-error"></div>
          <button class="ghost-button" type="submit" form="new-case-form">
            Create Case
          </button>
        </div>
      </section>
    </main>

    <script src="auth.js"></script>
    <script>
      requireAuth();
    </script>
    <script src="data.js"></script>
    <script src="new-case.js"></script>
  </body>
</html>
