<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLIP Case Management</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-nav="dashboard">
    <header class="app-header">
      <div class="header-spacer"></div>
      <a class="home-title" href="index.html">FLIP Schedule A Litigation</a>
      <div class="header-spacer"></div>
    </header>

    <div id="app-nav"></div>

    <main class="dashboard-main">
      <div id="dashboard-stats" class="stats-grid"></div>

      <div class="dashboard-columns">
        <section class="panel" id="tasks">
          <div class="panel-header">
            <div class="panel-header-row">
              <div>
                <h2>My Tasks</h2>
                <div class="muted">Assigned to you</div>
              </div>
            </div>
          </div>
          <div id="tasks-list" class="list"></div>
        </section>

        <section class="panel" id="dashboard">
          <div class="panel-header">
            <div class="panel-header-row">
              <div>
                <h2>Cases by Status</h2>
                <div class="muted">Grouped by status</div>
              </div>
              <a class="ghost-button" href="new-case.html">New Case</a>
            </div>
            <div id="case-status-tabs" class="tab-switch"></div>
          </div>
          <div id="case-groups" class="list"></div>
          <div class="info-card" id="jurisdiction-card">
            <h3>Cases by Jurisdiction</h3>
            <div id="jurisdiction-list" class="jurisdiction-list"></div>
          </div>
        </section>
      </div>
    </main>

    <script src="auth.js"></script>
    <script>
      requireAuth();
    </script>
    <script src="nav.js"></script>
    <script src="data.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
