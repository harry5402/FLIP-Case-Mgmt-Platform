<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLIP Case Management</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-nav="dashboard">
    <header class="app-header">
      <div class="header-spacer"></div>
      <a class="home-title" href="index.html">FLIP Schedule A Litigation</a>
      <div class="header-spacer"></div>
    </header>

    <div id="app-nav"></div>

    <main class="layout single">
      <section class="panel" id="tasks">
        <div class="panel-header">
          <div class="panel-header-row">
            <div>
              <h2>My Tasks</h2>
              <div class="muted">Assigned to you</div>
            </div>
          </div>
        </div>
        <div id="tasks-list" class="list"></div>
      </section>

      <section class="panel" id="statistics">
        <div class="panel-header">
          <div class="panel-header-row">
            <div>
              <h2>Statistics</h2>
              <div class="muted">Litigation docket overview</div>
            </div>
          </div>
        </div>
        <div id="statistics-body"></div>
      </section>

      <section class="panel" id="dashboard">
        <div class="panel-header">
          <div class="panel-header-row">
            <div>
              <h2>Cases</h2>
              <div class="muted">Grouped by status</div>
            </div>
            <div class="tab-switch">
              <a class="ghost-button" href="new-case.html">New Case</a>
            </div>
          </div>
        </div>
        <div id="case-groups" class="group-stack"></div>
      </section>
    </main>

    <script src="auth.js"></script>
    <script>
      requireAuth();
    </script>
    <script src="nav.js"></script>
    <script src="data.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
