<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="pill" id="back-to-case" href="index.html">Back to Case</a>
      <a class="home-title" href="index.html">FLIP Schedule A Litigation</a>
      <button class="ghost-button" id="assign-group-task-button" type="button">
        Assign Task
      </button>
    </header>

    <main class="layout single">
      <section class="panel" id="group-info">
        <div class="panel-header">
          <h2 id="group-title">Group</h2>
          <div id="group-meta" class="muted">Loading...</div>
        </div>

        <div class="case-grid">
          <div class="info-card">
            <h3>Case Info</h3>
            <div id="group-case-info" class="info-list"></div>
          </div>
          <div class="info-card">
            <h3>Group Info</h3>
            <div id="group-info-list" class="info-list"></div>
          </div>
        </div>

        <div class="dual-cards">
          <div class="notes-card compact">
            <div class="info-card-header">
              <h3>Templates</h3>
            </div>
            <div id="group-templates" class="list compact-list"></div>
          </div>
          <div class="notes-card compact">
            <div class="info-card-header">
              <h3>Group Snapshot</h3>
            </div>
            <div id="group-snapshot" class="info-list"></div>
          </div>
        </div>

        <div class="table-card">
          <div class="info-card-header">
            <h3>Negotiation</h3>
            <button id="group-negotiation-save" class="ghost-button" type="button">Save</button>
          </div>
          <div id="group-negotiation" class="info-list"></div>
        </div>

        <div class="table-card">
          <div class="info-card-header">
            <h3>Defendants</h3>
          </div>
          <div class="table-wrap">
            <table id="group-defendants-table">
              <thead>
                <tr>
                  <th>Doe #</th>
                  <th>Marketplace</th>
                  <th>Merchant ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Status</th>
                  <th>Def. Rep Email</th>
                  <th>Listings Count</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div class="table-card">
          <div class="info-card-header">
            <h3>Listings</h3>
          </div>
          <div class="table-wrap">
            <table id="group-listings-table">
              <thead>
                <tr>
                  <th>Defendant</th>
                  <th>Product ID</th>
                  <th>URL</th>
                  <th>Screenshots</th>
                  <th>Notes</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <div id="group-task-modal" class="modal hidden">
      <div class="modal-card">
        <div class="info-card-header">
          <h3>Assign Group Task</h3>
          <button class="ghost-button" id="close-group-task-modal" type="button">Close</button>
        </div>
        <form id="group-task-form" class="form-grid">
          <label class="form-field">
            <span>Task Type</span>
            <select name="taskType" required>
              <option value="Settlement Agreement">Settlement Agreement</option>
              <option value="Send Evidence">Send Evidence</option>
            </select>
          </label>
          <label class="form-field">
            <span>To</span>
            <select name="assignedToUserId" id="group-task-user-select" required></select>
          </label>
          <label class="form-field">
            <span>Due Date</span>
            <input name="dueDate" type="date" required />
          </label>
        </form>
        <div class="form-actions">
          <div id="group-task-error" class="form-error"></div>
          <button class="ghost-button" type="submit" form="group-task-form">Assign</button>
        </div>
      </div>
    </div>

    <script src="auth.js"></script>
    <script>
      requireAuth();
    </script>
    <script src="data.js"></script>
    <script src="group.js"></script>
  </body>
</html>
